<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2000 Natuurbranden — Laatste 12 uur</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f4f0; color: #1a1a1a; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    #header { padding: 12px 16px; background: #fff; border-bottom: 1px solid #e5e3dc; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; z-index: 1001; }
    #header h1 { font-size: 16px; font-weight: 500; }
    #count-badge { background: #D85A30; color: #fff; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 10px; }
    #status { font-size: 12px; color: #888; margin-left: auto; }
    #refresh-btn { font-size: 12px; padding: 4px 10px; cursor: pointer; border: 1px solid #ddd; border-radius: 8px; background: #fff; }
    #refresh-btn:hover { background: #f5f4f0; }
    #loading { padding: 8px 16px; font-size: 13px; color: #185FA5; background: #E6F1FB; display: none; align-items: center; gap: 8px; }
    #progress { font-size: 12px; color: #185FA5; margin-left: 4px; }
    .spinner { width: 14px; height: 14px; border: 2px solid #B5D4F4; border-top-color: #378ADD; border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error-msg { padding: 10px 16px; font-size: 13px; color: #A32D2D; background: #FCEBEB; display: none; }
    #map-container { position: relative; flex: 1; }
    #map { width: 100%; height: 100%; }
    #sidebar { position: absolute; right: 12px; top: 12px; width: 260px; max-height: calc(100% - 24px); overflow-y: auto; z-index: 1000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    #sidebar::-webkit-scrollbar { width: 4px; }
    #sidebar::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }
    .melding-card { background: #fff; border: 1px solid #e5e3dc; border-radius: 8px; padding: 10px 12px; pointer-events: all; cursor: pointer; transition: border-color 0.15s; }
    .melding-card:hover { border-color: #aaa; }
    .melding-titel { font-size: 12px; font-weight: 500; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .brand-dot { display: inline-block; width: 8px; height: 8px; background: #D85A30; border-radius: 50%; flex-shrink: 0; }
    .melding-meta { font-size: 11px; color: #666; line-height: 1.5; }
    .melding-count { font-size: 10px; background: #FAECE7; color: #993C1D; padding: 1px 6px; border-radius: 8px; display: inline-block; margin-top: 4px; }
    .geen-meldingen { background: #fff; border: 1px solid #e5e3dc; border-radius: 8px; padding: 14px; font-size: 12px; color: #666; text-align: center; pointer-events: all; }
    #bronvermelding { position: absolute; bottom: 6px; left: 10px; font-size: 10px; color: #888; z-index: 1000; background: rgba(255,255,255,0.8); padding: 2px 6px; border-radius: 4px; }
    #bronvermelding a { color: #378ADD; text-decoration: none; }
  </style>
</head>
<body>
<div id="app">
  <div id="header">
    <span style="font-size:20px;">🔥</span>
    <h1>P2000 Natuurbranden — Laatste 12 uur</h1>
    <span id="count-badge">0 meldingen</span>
    <span id="status">Laden...</span>
    <button id="refresh-btn" onclick="laadMeldingen()">↺ Vernieuwen</button>
  </div>
  <div id="loading" style="display:flex;">
    <div class="spinner"></div>
    <span>Alle regio's ophalen...</span>
    <span id="progress"></span>
  </div>
  <div id="error-msg"></div>
  <div id="map-container">
    <div id="map"></div>
    <div id="sidebar"></div>
    <div id="bronvermelding">Bron: <a href="https://112-nu.nl" target="_blank">112-nu.nl</a></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Echte P2000-codes (altijd hoofdletters in ruwe berichten, maar we vergelijken lowercase)
const BRAND_TERMEN = [
  // Officiële P2000-incidentcodes
  'br bos', 'br heide', 'br duin', 'br berm', 'br veen',
  'br gras', 'br riet', 'br struik',
  // Varianten met "brand"
  'brand bos', 'brand heide', 'brand duin', 'brand berm',
  'brand veen', 'brand gras', 'brand riet',
  // 112-nu.nl schrijft codes soms voluit
  'berm/bosschage', 'bosschage',
  'brandmelding buiten', 'brand buiten',
  // Afkortingen
  'nwbrrn',           // natuurbrand
  'nbr',              // natuurbrand (alternatief)
  // Gewone termen als fallback
  'natuurbrand', 'bermbrand', 'heidebrand', 'veenbrand',
  'bosbrand', 'grasbrand', 'rietbrand', 'duinbrand',
];

const PROXY = 'https://api.rss2json.com/v1/api.json?rss_url=';

// Alle 25 regio-feeds van 112-nu.nl
const REGIO_FEEDS = [
  { naam: 'Groningen',               url: 'https://112-nu.nl/regio/groningen/rss' },
  { naam: 'Friesland',               url: 'https://112-nu.nl/regio/friesland/rss' },
  { naam: 'Drenthe',                 url: 'https://112-nu.nl/regio/drenthe/rss' },
  { naam: 'Overijssel',              url: 'https://112-nu.nl/regio/overijssel/rss' },
  { naam: 'Flevoland',               url: 'https://112-nu.nl/regio/flevoland/rss' },
  { naam: 'Gelderland',              url: 'https://112-nu.nl/regio/gelderland/rss' },
  { naam: 'Utrecht',                 url: 'https://112-nu.nl/regio/utrecht/rss' },
  { naam: 'Noord-Holland',           url: 'https://112-nu.nl/regio/noord-holland/rss' },
  { naam: 'Zuid-Holland',            url: 'https://112-nu.nl/regio/zuid-holland/rss' },
  { naam: 'Zeeland',                 url: 'https://112-nu.nl/regio/zeeland/rss' },
  { naam: 'Noord-Brabant',           url: 'https://112-nu.nl/regio/noord-brabant/rss' },
  { naam: 'Limburg',                 url: 'https://112-nu.nl/regio/limburg/rss' },
  { naam: 'Brandweer',               url: 'https://112-nu.nl/brandweer/rss' },
];

const map = L.map('map').setView([52.3, 5.3], 8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a>', maxZoom: 18
}).addTo(map);

let markers = [];

function afstandKm(lat1, lon1, lat2, lon2) {
  const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function samenvoegen(meldingen) {
  const groepen = [];
  for (const m of meldingen) {
    let gevonden = false;
    for (const g of groepen) {
      if (afstandKm(m.lat, m.lon, g.lat, g.lon) <= 10) {
        g.count++; g.teksten.push(m.tekst); g.tijden.push(m.tijd); gevonden = true; break;
      }
    }
    if (!gevonden) groepen.push({ lat: m.lat, lon: m.lon, locatie: m.locatie, teksten: [m.tekst], tijden: [m.tijd], count: 1 });
  }
  return groepen;
}

function toonOpKaart(groepen) {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  document.getElementById('count-badge').textContent = groepen.length + ' melding' + (groepen.length !== 1 ? 'en' : '');

  if (groepen.length === 0) {
    const card = document.createElement('div');
    card.className = 'geen-meldingen';
    card.textContent = 'Geen actieve natuurbrandmeldingen in de afgelopen 12 uur.';
    sidebar.appendChild(card); return;
  }

  // Sorteer op aantal meldingen (meest actief bovenaan)
  groepen.sort((a, b) => b.count - a.count);

  groepen.forEach(g => {
    const kleur = g.count >= 3 ? '#A32D2D' : g.count === 2 ? '#D85A30' : '#E24B4A';
    const circle = L.circleMarker([g.lat, g.lon], {
      radius: 8 + g.count * 3, fillColor: kleur,
      color: '#fff', weight: 2, opacity: 1, fillOpacity: 0.88
    }).addTo(map);
    circle.bindPopup(`<b style="font-size:13px;">🔥 ${g.locatie}</b><br/>
      <span style="font-size:11px;color:#666;">${g.count} melding${g.count>1?'en':''}</span><br/>
      <div style="margin-top:6px;font-size:11px;line-height:1.6;">${g.teksten.slice(0,4).map(t=>'• '+t).join('<br/>')}</div>
      <div style="margin-top:4px;font-size:10px;color:#888;">Tijden: ${g.tijden.slice(0,4).join(', ')}</div>`);
    markers.push(circle);

    const card = document.createElement('div');
    card.className = 'melding-card';
    card.innerHTML = `<div class="melding-titel"><span class="brand-dot"></span>${g.locatie}</div>
      <div class="melding-meta">${g.teksten[0]}<br/>${g.tijden[0]}</div>
      ${g.count>1?`<span class="melding-count">${g.count} meldingen samengevoegd</span>`:''}`;
    card.onclick = () => { map.setView([g.lat, g.lon], 12); circle.openPopup(); };
    sidebar.appendChild(card);
  });

  map.fitBounds(L.latLngBounds(groepen.map(g => [g.lat, g.lon])).pad(0.3));
}

async function geocodeer(plaatsnaam) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(plaatsnaam+', Nederland')}&format=json&limit=1&countrycodes=nl`, { headers: { 'Accept-Language': 'nl' } });
    const d = await r.json();
    if (d.length > 0) return { lat: parseFloat(d[0].lat), lon: parseFloat(d[0].lon) };
  } catch(e) {}
  return null;
}

function isNatuurbrand(tekst) {
  const t = tekst.toLowerCase();
  return BRAND_TERMEN.some(term => t.includes(term));
}

function binnenTwaalf(pubDate) {
  try { return (Date.now() - new Date(pubDate).getTime()) < 12 * 60 * 60 * 1000; } catch(e) { return false; }
}

function formatTijd(pubDate) {
  try { return new Date(pubDate).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' }); } catch(e) { return ''; }
}

function extractPlaats(item) {
  // De RSS description bevat "Plaatsnaam, Straatnaam" — gebruik dat als eerste keus
  const desc = (item.description || '').replace(/<[^>]+>/g, '').trim();
  if (desc && desc.length > 0 && desc.length < 80) {
    const match = desc.match(/^([^,\n]+)/);
    if (match) return match[1].trim();
  }
  // Fallback: pak eerste deel van de titel vóór het eerste streepje
  const titel = (item.title || '');
  const match = titel.match(/^([^,\-–]+)/);
  return match ? match[1].trim() : titel.trim();
}

// Haal één regio-feed op, geeft gefilterde items terug
async function haalFeed(feed) {
  try {
    const resp = await fetch(PROXY + encodeURIComponent(feed.url));
    const data = await resp.json();
    if (!data.items || data.status !== 'ok') return [];
    return data.items.filter(item => {
      const tekst = (item.title || '') + ' ' + (item.description || '');
      return isNatuurbrand(tekst) && binnenTwaalf(item.pubDate);
    });
  } catch(e) { return []; }
}

// Geocodeer in batches om Nominatim niet te overbelasten
async function geocodeerBatch(items) {
  const meldingen = [];
  // Dedupleer plaatsnamen zodat we niet meerdere keren dezelfde geocoderen
  const plaatsCache = {};

  for (const item of items) {
    const plaats = extractPlaats(item);
    if (!plaatsCache[plaats]) {
      plaatsCache[plaats] = await geocodeer(plaats);
      await new Promise(r => setTimeout(r, 120)); // kleine pauze voor Nominatim fair-use
    }
    const coords = plaatsCache[plaats];
    if (coords) {
      meldingen.push({ locatie: plaats, tekst: item.title || '', tijd: formatTijd(item.pubDate), lat: coords.lat, lon: coords.lon });
    }
  }
  return meldingen;
}

async function laadMeldingen() {
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('error-msg').style.display = 'none';
  document.getElementById('status').textContent = 'Ophalen...';
  document.getElementById('progress').textContent = '';

  try {
    // Haal alle regio-feeds parallel op
    let gedaan = 0;
    const updateProgress = () => {
      gedaan++;
      document.getElementById('progress').textContent = `(${gedaan}/${REGIO_FEEDS.length} regio's)`;
    };

    const feedResultaten = await Promise.all(
      REGIO_FEEDS.map(feed => haalFeed(feed).then(items => { updateProgress(); return items; }))
    );

    // Samenvoegen en dedupliceren op tekst
    const alleItems = feedResultaten.flat();
    const uniek = [];
    const gezien = new Set();
    for (const item of alleItems) {
      const key = (item.title || '').trim().toLowerCase();
      if (!gezien.has(key)) { gezien.add(key); uniek.push(item); }
    }

    document.getElementById('progress').textContent = `— ${uniek.length} brandmeldingen gevonden, locaties bepalen...`;

    const meldingen = await geocodeerBatch(uniek);
    const groepen = samenvoegen(meldingen);
    toonOpKaart(groepen);

    const nu = new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('status').textContent = `Bijgewerkt om ${nu} — ${REGIO_FEEDS.length} regio's`;
  } catch(err) {
    document.getElementById('error-msg').style.display = 'block';
    document.getElementById('error-msg').textContent = 'Fout bij ophalen: ' + err.message;
    document.getElementById('status').textContent = 'Fout';
  } finally {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('progress').textContent = '';
  }
}

laadMeldingen();
setInterval(laadMeldingen, 5 * 60 * 1000);
</script>
</body>
</html>
