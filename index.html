<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2000 Natuurbranden</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f4f0; color: #1a1a1a; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    #header { padding: 12px 16px; background: #fff; border-bottom: 1px solid #e5e3dc; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; z-index: 1001; }
    #header h1 { font-size: 16px; font-weight: 500; }
    #count-badge { background: #D85A30; color: #fff; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 10px; }
    #status { font-size: 12px; color: #888; margin-left: auto; }
    #refresh-btn { font-size: 12px; padding: 4px 10px; cursor: pointer; border: 1px solid #ddd; border-radius: 8px; background: #fff; }
    #refresh-btn:hover:not(:disabled) { background: #f5f4f0; }
    #refresh-btn:disabled { opacity: 0.5; cursor: default; }
    #loading { padding: 8px 16px; font-size: 13px; color: #185FA5; background: #E6F1FB; display: none; align-items: center; gap: 8px; }
    .spinner { width: 14px; height: 14px; border: 2px solid #B5D4F4; border-top-color: #378ADD; border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error-msg { padding: 10px 16px; font-size: 13px; color: #A32D2D; background: #FCEBEB; display: none; }
    #map-container { position: relative; flex: 1; }
    #map { width: 100%; height: 100%; }
    #sidebar { position: absolute; right: 12px; top: 12px; width: 260px; max-height: calc(100% - 24px); overflow-y: auto; z-index: 1000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    #sidebar::-webkit-scrollbar { width: 4px; }
    #sidebar::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }
    .melding-card { background: #fff; border: 1px solid #e5e3dc; border-radius: 8px; padding: 10px 12px; pointer-events: all; cursor: pointer; transition: border-color 0.15s; }
    .melding-card:hover { border-color: #aaa; }
    .melding-card.oud { opacity: 0.7; }
    .melding-titel { font-size: 12px; font-weight: 500; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .brand-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .brand-dot.recent { background: #E24B4A; }
    .brand-dot.oud { background: #666; }
    .melding-meta { font-size: 11px; color: #666; line-height: 1.5; }
    .melding-count { font-size: 10px; background: #FAECE7; color: #993C1D; padding: 1px 6px; border-radius: 8px; display: inline-block; margin-top: 4px; }
    .geen-meldingen { background: #fff; border: 1px solid #e5e3dc; border-radius: 8px; padding: 14px; font-size: 12px; color: #666; text-align: center; pointer-events: all; }
    #legenda { position: absolute; bottom: 28px; left: 10px; z-index: 1000; background: rgba(255,255,255,0.92); border: 1px solid #e5e3dc; border-radius: 8px; padding: 8px 12px; font-size: 11px; color: #555; display: flex; flex-direction: column; gap: 4px; }
    .legenda-item { display: flex; align-items: center; gap: 6px; }
    .legenda-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #ccc; flex-shrink: 0; }
    #bronvermelding { position: absolute; bottom: 6px; left: 10px; font-size: 10px; color: #888; z-index: 1000; background: rgba(255,255,255,0.8); padding: 2px 6px; border-radius: 4px; }
    #bronvermelding a { color: #378ADD; text-decoration: none; }
  </style>
</head>
<body>
<div id="app">
  <div id="header">
    <span style="font-size:20px;">🔥</span>
    <h1>P2000 Natuurbranden</h1>
    <span id="count-badge">0 meldingen</span>
    <span id="status">Laden...</span>
    <div id="weer" style="display:flex;align-items:center;gap:12px;font-size:12px;color:#555;border-left:1px solid #e5e3dc;padding-left:12px;">
      <span id="weer-temp" title="Temperatuur">🌡️ --°C</span>
      <span id="weer-vocht" title="Luchtvochtigheid">💧 --%</span>
      <span id="weer-wind" title="Windsnelheid">💨 -- km/u</span>
      <span id="weer-plaats" style="color:#aaa;font-size:10px;"></span>
    </div>
    <button id="refresh-btn" onclick="vernieuwen()">↺ Vernieuwen</button>
    <div id="update-info" style="font-size:10px;color:#aaa;width:100%;padding-top:2px;">
      <span id="laatste-update">Laatste update: ophalen...</span> ·
      <span id="volgende-update">Volgende update: --:--</span>
    </div>
  </div>
  <div id="loading" style="display:flex;">
    <div class="spinner"></div>
    <span>Meldingen laden...</span>
  </div>
  <div id="error-msg"></div>
  <div id="map-container">
    <div id="map"></div>
    <div id="sidebar"></div>
    <div id="legenda">
      <div class="legenda-item"><div class="legenda-dot" style="background:#E24B4A;"></div> Afgelopen uur</div>
      <div class="legenda-item"><div class="legenda-dot" style="background:#555;"></div> Ouder dan 1 uur</div>
    </div>
    <div id="bronvermelding">Bron: <a href="https://112-nu.nl" target="_blank">112-nu.nl</a></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── Kaart ─────────────────────────────────────────────────────────────────────
const map = L.map('map').setView([52.3, 5.3], 8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a>', maxZoom: 18
}).addTo(map);
let markers = [];

// ── Hulpfuncties ──────────────────────────────────────────────────────────────
function isRecent(isoString) {
  try { return (Date.now() - new Date(isoString).getTime()) < 60 * 60 * 1000; }
  catch(e) { return false; }
}

function afstandKm(lat1, lon1, lat2, lon2) {
  const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function samenvoegen(meldingen) {
  const groepen = [];
  for (const m of meldingen) {
    let gevonden = false;
    for (const g of groepen) {
      if (afstandKm(m.lat, m.lon, g.lat, g.lon) <= 10) {
        g.count++;
        g.teksten.push(m.tekst);
        g.tijden.push(m.tijd);
        // Groep is recent als minstens één melding recent is
        if (m.recent) g.recent = true;
        gevonden = true; break;
      }
    }
    if (!gevonden) groepen.push({
      lat: m.lat, lon: m.lon,
      locatie: m.plaats, straat: m.straat,
      teksten: [m.tekst], tijden: [m.tijd],
      recent: m.recent, count: 1
    });
  }
  return groepen;
}

function toonOpKaart(groepen) {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';

  const totaal = groepen.length;
  const recent = groepen.filter(g => g.recent).length;
  document.getElementById('count-badge').textContent =
    totaal + ' melding' + (totaal !== 1 ? 'en' : '');

  if (totaal === 0) {
    const card = document.createElement('div');
    card.className = 'geen-meldingen';
    card.textContent = 'Geen natuurbrandmeldingen gevonden.';
    sidebar.appendChild(card);
    return;
  }

  // Sorteer: recente eerst, dan op count
  groepen.sort((a, b) => {
    if (a.recent !== b.recent) return b.recent - a.recent;
    return b.count - a.count;
  });

  groepen.forEach(g => {
    const kleur  = g.recent
      ? (g.count >= 3 ? '#A32D2D' : g.count === 2 ? '#D85A30' : '#E24B4A')
      : (g.count >= 3 ? '#333' : g.count === 2 ? '#444' : '#666');
    const radius = 8 + g.count * 3;

    const circle = L.circleMarker([g.lat, g.lon], {
      radius, fillColor: kleur,
      color: '#fff', weight: 2,
      opacity: 1, fillOpacity: g.recent ? 0.9 : 0.6
    }).addTo(map);

    circle.bindPopup(`
      <div style="min-width:200px;font-family:'Segoe UI',system-ui,sans-serif;">
        <div style="font-size:14px;font-weight:600;color:#1a1a1a;margin-bottom:2px;">
          🔥 ${g.locatie}
        </div>
        ${g.straat ? `
        <div style="font-size:12px;color:#555;margin-bottom:8px;">
          📍 ${g.straat}
        </div>` : '<div style="margin-bottom:8px;"></div>'}
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${g.recent ? '#E24B4A' : '#666'};flex-shrink:0;"></span>
          <span style="font-size:11px;color:#888;">${g.recent ? 'Afgelopen uur' : 'Ouder dan 1 uur'}</span>
          ${g.count > 1 ? `<span style="font-size:10px;background:#FAECE7;color:#993C1D;padding:1px 6px;border-radius:8px;">${g.count}x</span>` : ''}
        </div>
        <div style="border-top:1px solid #f0f0f0;padding-top:8px;display:flex;flex-direction:column;gap:6px;">
          ${g.teksten.slice(0,4).map((t, i) => `
            <div style="font-size:11px;color:#333;">
              <div style="color:#aaa;font-size:10px;margin-bottom:1px;">${g.tijden[i] || ''}</div>
              <div>${t}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `, { maxWidth: 280 });
    markers.push(circle);

    const card = document.createElement('div');
    card.className = 'melding-card' + (g.recent ? '' : ' oud');
    card.innerHTML = `
      <div class="melding-titel">
        <span class="brand-dot ${g.recent ? 'recent' : 'oud'}"></span>
        ${g.locatie}
      </div>
      <div class="melding-meta">
        ${g.straat ? `📍 ${g.straat}<br/>` : ''}
        ${g.tijden[0]}
      </div>
      ${g.count > 1 ? `<span class="melding-count">${g.count} meldingen samengevoegd</span>` : ''}
    `;
    card.onclick = () => { map.setView([g.lat, g.lon], 13); circle.openPopup(); };
    sidebar.appendChild(card);
  });

  // Zoom alleen naar recente meldingen als die er zijn, anders alle
  const zoom_groepen = groepen.filter(g => g.recent).length > 0
    ? groepen.filter(g => g.recent)
    : groepen;
  map.fitBounds(L.latLngBounds(zoom_groepen.map(g => [g.lat, g.lon])).pad(0.3));
}

function formatTijd(isoString) {
  try {
    // Tijd is al in Nederlandse lokale tijd opgeslagen — toon zonder omzetting
    const dt = new Date(isoString);
    const uren = String(dt.getHours()).padStart(2, '0');
    const min  = String(dt.getMinutes()).padStart(2, '0');
    return `${uren}:${min}`;
  } catch(e) { return ''; }
}

// ── Data laden ────────────────────────────────────────────────────────────────
async function laadMeldingen() {
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('error-msg').style.display = 'none';
  document.getElementById('status').textContent = 'Laden...';

  try {
    const resp = await fetch('data/meldingen.json?t=' + Date.now());
    if (!resp.ok) throw new Error('data/meldingen.json niet gevonden (HTTP ' + resp.status + ')');
    const meldingen = await resp.json();

    const geldig = meldingen
      .filter(m => m.lat && m.lon)
      .map(m => ({
        lat: m.lat, lon: m.lon,
        plaats: m.plaats || '?',
        straat: m.straat || '',
        tekst: m.title || '',
        tijd: formatTijd(m.pubDate),
        recent: isRecent(m.pubDate),
      }));

    toonOpKaart(samenvoegen(geldig));

    const nu = new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Amsterdam' });
    const recentCount = geldig.filter(m => m.recent).length;
    document.getElementById('status').textContent =
      `Bijgewerkt om ${nu} · ${recentCount} recent · ${geldig.length} totaal`;

  } catch(err) {
    document.getElementById('error-msg').style.display = 'block';
    document.getElementById('error-msg').textContent = 'Fout: ' + err.message;
    document.getElementById('status').textContent = 'Fout';
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}

async function vernieuwen() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  btn.textContent = '↺ Laden...';
  await laadMeldingen();
  await laadWeer();
  await laadUpdateInfo();
  btn.disabled = false;
  btn.textContent = '↺ Vernieuwen';
}

// ── Laatste & volgende update ophalen via status.json ────────────────────────
async function laadUpdateInfo() {
  try {
    const resp = await fetch('data/status.json?t=' + Date.now());
    if (!resp.ok) throw new Error('status.json niet gevonden');
    const data = await resp.json();

    const commitTijd = new Date(data.laatste_run);
    const nu = new Date();

    // Laatste update
    const diff = Math.round((nu - commitTijd) / 60000);
    const tijdStr = commitTijd.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Amsterdam' });
    const geleden = diff < 1 ? 'zojuist' : diff === 1 ? '1 min geleden' : `${diff} min geleden`;
    document.getElementById('laatste-update').textContent = `Laatste update: ${tijdStr} (${geleden})`;

    // Volgende update: elke 5 minuten
    const volgende = new Date(commitTijd.getTime() + 5 * 60 * 1000);
    const volgendeStr = volgende.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Amsterdam' });
    const overMinuten = Math.max(0, Math.round((volgende - nu) / 60000));
    const overStr = overMinuten <= 0 ? 'elk moment' : `over ${overMinuten} min`;
    document.getElementById('volgende-update').textContent = `Volgende update: ${volgendeStr} (${overStr})`;

  } catch(e) {
    document.getElementById('laatste-update').textContent = 'Laatste update: onbekend';
    document.getElementById('volgende-update').textContent = '';
  }
}


async function laadWeer() {
  try {
    const url = 'https://api.open-meteo.com/v1/forecast' +
      '?latitude=52.1&longitude=5.18' +
      '&current=temperature_2m,relative_humidity_2m,wind_speed_10m' +
      '&wind_speed_unit=kmh&timezone=Europe%2FAmsterdam';

    const resp = await fetch(url);
    const data = await resp.json();
    const c = data.current;

    document.getElementById('weer-temp').textContent  = `🌡️ ${Math.round(c.temperature_2m)}°C`;
    document.getElementById('weer-wind').textContent  = `💨 ${Math.round(c.wind_speed_10m)} km/u`;

    // Luchtvochtigheid: kleur op basis van brandgevaar
    const vocht = c.relative_humidity_2m;
    const vochtEl = document.getElementById('weer-vocht');
    vochtEl.textContent = `💧 ${vocht}%`;
    vochtEl.style.color  = vocht < 30 ? '#D85A30' : vocht < 50 ? '#E8A020' : '#555';
    vochtEl.title        = vocht < 30 ? '⚠️ Kritiek laag — hoog brandgevaar!'
                         : vocht < 50 ? '⚠️ Laag — verhoogd brandgevaar'
                         : 'Normaal';

    document.getElementById('weer-plaats').textContent = 'KNMI De Bilt';
  } catch(e) {
    console.log('Weer ophalen mislukt:', e);
  }
}

laadMeldingen();
laadWeer();
laadUpdateInfo();
setInterval(laadMeldingen, 5 * 60 * 1000);
setInterval(laadWeer, 10 * 60 * 1000);
setInterval(laadUpdateInfo, 60 * 1000); // elke minuut de tijden bijwerken
</script>
</body>
</html>
